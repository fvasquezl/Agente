[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agente3"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.4.3",
    "langchain-groq>=1.1.3",
    "python-dotenv>=1.2.4",
]

[tool.setuptools]
py-modules = ["agent"]

[tool.basedpyright]
venvPath = "."
venv = "venv"
